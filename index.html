<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Project Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --text: #e8eaf6;
    --text-muted: #7b82b0;
    --accent: #6c63ff;
    --accent-soft: #312e6e;
    --danger: #ff4d6d;
    --warn: #ffb347;
    --success: #3ecf8e;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ─────────────────────────── */
  #sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
  }

  .sidebar-logo {
    padding: 0 20px 20px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-logo span { font-size: 22px; }

  .sidebar-section {
    padding: 16px 20px 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar-section button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }
  .sidebar-section button:hover { color: var(--accent); background: var(--accent-soft); }

  #project-list { flex: 1; overflow-y: auto; padding: 4px 0; }

  .project-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    cursor: pointer;
    border-radius: 0;
    transition: background 0.15s;
    font-size: 14px;
    position: relative;
  }
  .project-item:hover { background: var(--surface2); }
  .project-item.active { background: var(--accent-soft); color: var(--accent); }
  .project-item.active .project-dot { box-shadow: 0 0 0 2px var(--accent); }

  .project-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .project-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .project-count {
    font-size: 11px;
    background: var(--surface2);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 1px 7px;
    min-width: 22px;
    text-align: center;
  }
  .project-item.active .project-count { background: var(--accent); color: #fff; }

  .project-del {
    display: none;
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .project-item:hover .project-del { display: block; }

  #all-tasks-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px; cursor: pointer;
    font-size: 14px; transition: background 0.15s;
  }
  #all-tasks-btn:hover { background: var(--surface2); }
  #all-tasks-btn.active { background: var(--accent-soft); color: var(--accent); }
  #all-tasks-btn span.icon { font-size: 14px; }

  /* ── MAIN ────────────────────────────── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #view-title {
    font-size: 18px;
    font-weight: 700;
    flex: 1;
    min-width: 120px;
  }

  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .filter-label { font-size: 12px; color: var(--text-muted); }

  select, .btn-sm {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  select:hover, .btn-sm:hover { border-color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }

  /* ── KANBAN ──────────────────────────── */
  #board {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 20px 24px;
    overflow-x: auto;
    overflow-y: hidden;
    align-items: flex-start;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 300px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }

  .column-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
    flex-shrink: 0;
  }

  .col-dot { width: 8px; height: 8px; border-radius: 50%; }
  .col-todo .col-dot    { background: var(--text-muted); }
  .col-inprogress .col-dot { background: var(--warn); }
  .col-done .col-dot    { background: var(--success); }

  .col-count {
    margin-left: auto;
    font-size: 11px;
    background: var(--surface2);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 1px 8px;
  }

  .task-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 60px;
  }

  .task-list.drag-over {
    background: rgba(108, 99, 255, 0.06);
    border-radius: 6px;
  }

  /* ── TASK CARD ───────────────────────── */
  .task-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: grab;
    transition: box-shadow 0.15s, transform 0.1s, border-color 0.15s;
    position: relative;
  }
  .task-card:hover { box-shadow: var(--shadow); border-color: var(--accent); transform: translateY(-1px); }
  .task-card.dragging { opacity: 0.4; transform: rotate(2deg); cursor: grabbing; }

  .task-top {
    display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px;
  }

  .task-title { font-size: 14px; font-weight: 500; flex: 1; line-height: 1.4; }

  .task-actions {
    display: flex; gap: 4px; flex-shrink: 0;
    opacity: 0; transition: opacity 0.15s;
  }
  .task-card:hover .task-actions { opacity: 1; }

  .task-btn {
    background: none; border: none; cursor: pointer;
    font-size: 14px; padding: 2px 4px; border-radius: 4px;
    color: var(--text-muted); transition: color 0.15s, background 0.15s;
  }
  .task-btn:hover { color: var(--text); background: var(--border); }
  .task-btn.del:hover { color: var(--danger); }

  .task-meta {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }

  .badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    cursor: pointer; transition: opacity 0.15s;
  }
  .badge:hover { opacity: 0.75; }

  .priority-high   { background: rgba(255,77,109,0.2);  color: var(--danger); }
  .priority-medium { background: rgba(255,179,71,0.2);  color: var(--warn); }
  .priority-low    { background: rgba(62,207,142,0.2);  color: var(--success); }

  .status-badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 20px; cursor: pointer;
  }
  .status-todo       { background: rgba(123,130,176,0.2); color: var(--text-muted); }
  .status-inprogress { background: rgba(255,179,71,0.2);  color: var(--warn); }
  .status-done       { background: rgba(62,207,142,0.2);  color: var(--success); }

  .due-date {
    font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; gap: 3px;
    margin-left: auto;
  }
  .due-date.overdue { color: var(--danger); }
  .due-date.soon    { color: var(--warn); }

  .project-pill {
    font-size: 10px; padding: 2px 7px; border-radius: 20px;
    font-weight: 600; letter-spacing: 0.3px;
  }

  .task-notes {
    font-size: 12px; color: var(--text-muted);
    margin-top: 6px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ── MODAL ───────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 480px;
    max-width: 96vw;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: var(--shadow);
    transform: translateY(12px);
    transition: transform 0.2s;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal h2 {
    font-size: 18px; font-weight: 700; margin-bottom: 20px;
  }

  .form-field { margin-bottom: 16px; }

  .form-field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .form-field input, .form-field select, .form-field textarea {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px;
    font-size: 14px; outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    border-color: var(--accent);
  }
  .form-field textarea { resize: vertical; min-height: 80px; }

  .color-picker {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px;
  }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: #fff; transform: scale(1.1); }

  .form-row { display: flex; gap: 12px; }
  .form-row .form-field { flex: 1; }

  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px;
  }

  .btn-ghost {
    background: none; border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

  /* ── EMPTY STATE ─────────────────────── */
  .empty-col {
    text-align: center; padding: 24px 12px;
    color: var(--text-muted); font-size: 13px;
  }
  .empty-col .empty-icon { font-size: 28px; margin-bottom: 6px; }

  /* ── AUTH OVERLAY ───────────────────── */
  #auth-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #auth-overlay.hidden { display: none; }

  .auth-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    width: 380px; max-width: 92vw;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .auth-logo { font-size: 42px; margin-bottom: 14px; }
  .auth-box h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .auth-box p  { font-size: 14px; color: var(--text-muted); margin-bottom: 26px; line-height: 1.5; }

  .auth-input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 12px 14px;
    font-size: 15px; outline: none;
    transition: border-color 0.15s; margin-bottom: 10px;
    text-align: center; letter-spacing: 3px;
    font-family: inherit;
  }
  .auth-input::placeholder { letter-spacing: 0; }
  .auth-input:focus { border-color: var(--accent); }

  .auth-error {
    color: var(--danger); font-size: 13px;
    min-height: 18px; margin-bottom: 10px;
  }
  .btn-auth {
    width: 100%; background: var(--accent);
    border: none; color: #fff; border-radius: 8px;
    padding: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    margin-bottom: 14px;
  }
  .btn-auth:hover { opacity: 0.85; transform: translateY(-1px); }
  .auth-hint { font-size: 12px; color: var(--text-muted); }
  .auth-change-link {
    font-size: 12px; color: var(--text-muted); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
    background: none; border: none; margin-top: 10px; display: block; width: 100%;
    transition: color 0.15s;
  }
  .auth-change-link:hover { color: var(--accent); }

  /* sidebar footer */
  .sidebar-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-footer button {
    background: none; border: none; color: var(--text-muted);
    font-size: 12px; cursor: pointer; padding: 4px 8px;
    border-radius: 6px; transition: color 0.15s, background 0.15s;
    display: flex; align-items: center; gap: 4px;
  }
  .sidebar-footer button:hover { color: var(--text); background: var(--surface2); }

  /* ── SCROLLBAR ───────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ── TOAST ───────────────────────────── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 18px; font-size: 13px;
    box-shadow: var(--shadow); transition: transform 0.3s;
    z-index: 9999; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-logo"><span>📋</span> My Tracker</div>

  <div style="padding: 12px 20px 4px;">
    <div id="all-tasks-btn" class="active" onclick="selectProject(null)">
      <span class="icon">🗂</span> All Tasks
      <span id="all-count" class="project-count" style="margin-left:auto">0</span>
    </div>
  </div>

  <div class="sidebar-section">
    Projects
    <button onclick="openProjectModal()" title="New project">+</button>
  </div>

  <div id="project-list"></div>

  <div class="sidebar-footer">
    <button onclick="lockApp()" title="Lock tracker">🔒 Lock</button>
    <button onclick="changePasswordFlow()" title="Change password">Change PW</button>
  </div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div id="view-title">All Tasks</div>
    <div class="filter-group">
      <span class="filter-label">Priority</span>
      <select id="filter-priority" onchange="renderBoard()">
        <option value="all">All</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Sort by</span>
      <select id="sort-by" onchange="renderBoard()">
        <option value="none">None</option>
        <option value="due-asc">Due Date ↑</option>
        <option value="due-desc">Due Date ↓</option>
        <option value="priority">Priority</option>
      </select>
    </div>
    <button class="btn-primary" onclick="openTaskModal()">+ Add Task</button>
  </div>

  <div id="board">
    <div class="column col-todo" id="col-todo" ondragover="onDragOver(event,'todo')" ondrop="onDrop(event,'todo')" ondragleave="onDragLeave(event)">
      <div class="column-header">
        <span class="col-dot"></span> To Do
        <span class="col-count" id="count-todo">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
    </div>

    <div class="column col-inprogress" id="col-inprogress" ondragover="onDragOver(event,'inprogress')" ondrop="onDrop(event,'inprogress')" ondragleave="onDragLeave(event)">
      <div class="column-header">
        <span class="col-dot"></span> In Progress
        <span class="col-count" id="count-inprogress">0</span>
      </div>
      <div class="task-list" id="list-inprogress"></div>
    </div>

    <div class="column col-done" id="col-done" ondragover="onDragOver(event,'done')" ondrop="onDrop(event,'done')" ondragleave="onDragLeave(event)">
      <div class="column-header">
        <span class="col-dot"></span> Done
        <span class="col-count" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </div>
  </div>
</div>

<!-- PROJECT MODAL -->
<div class="modal-backdrop" id="project-modal">
  <div class="modal">
    <h2 id="project-modal-title">New Project</h2>
    <div class="form-field">
      <label>Project Name</label>
      <input type="text" id="project-name-input" placeholder="e.g. Website Redesign" />
    </div>
    <div class="form-field">
      <label>Color</label>
      <div class="color-picker" id="color-picker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeProjectModal()">Cancel</button>
      <button class="btn-primary" onclick="saveProject()">Save Project</button>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-backdrop" id="task-modal">
  <div class="modal">
    <h2 id="task-modal-title">New Task</h2>
    <div class="form-field">
      <label>Task Title</label>
      <input type="text" id="task-title-input" placeholder="What needs to be done?" />
    </div>
    <div class="form-field">
      <label>Notes</label>
      <textarea id="task-notes-input" placeholder="Any details or context…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>Priority</label>
        <select id="task-priority-input">
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="form-field">
        <label>Status</label>
        <select id="task-status-input">
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>Due Date</label>
        <input type="date" id="task-due-input" />
      </div>
      <div class="form-field">
        <label>Project</label>
        <select id="task-project-input">
          <option value="">No Project</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeTaskModal()">Cancel</button>
      <button class="btn-primary" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- AUTH OVERLAY -->
<div id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">🔒</div>
    <h1 id="auth-title">My Tracker</h1>
    <p  id="auth-subtitle">Enter your password to continue.</p>
    <input type="password" class="auth-input" id="auth-pw"      placeholder="Password"         autocomplete="current-password" />
    <input type="password" class="auth-input" id="auth-confirm" placeholder="Confirm password" autocomplete="new-password" style="display:none" />
    <div class="auth-error" id="auth-error"></div>
    <button class="btn-auth" id="auth-btn">Unlock</button>
    <div class="auth-hint" id="auth-hint">Session stays unlocked until you close the tab.</div>
    <button class="auth-change-link" id="auth-cancel-change" style="display:none" onclick="cancelChangePassword()">← Back to login</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────
const COLORS = [
  '#6c63ff','#ff4d6d','#ffb347','#3ecf8e','#36b5f6',
  '#e879f9','#f97316','#14b8a6','#a78bfa','#fb7185',
  '#84cc16','#38bdf8','#fbbf24','#34d399','#c084fc'
];

let state = {
  projects: [],
  tasks: [],
  activeProject: null, // null = all
  editingTaskId: null,
  editingProjectId: null,
  selectedColor: COLORS[0],
};

function load() {
  try {
    const saved = localStorage.getItem('tracker_v2');
    if (saved) Object.assign(state, JSON.parse(saved));
  } catch(e) {}
}

function save() {
  localStorage.setItem('tracker_v2', JSON.stringify({
    projects: state.projects,
    tasks: state.tasks,
    activeProject: state.activeProject,
  }));
}

// ── HELPERS ────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${+m}/${+day}/${y.slice(2)}`;
}

function dueDateClass(dueDate) {
  if (!dueDate) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueDate + 'T00:00:00');
  const diff = (due - today) / 86400000;
  if (diff < 0) return 'overdue';
  if (diff <= 2) return 'soon';
  return '';
}

function priorityOrder(p) { return { high: 0, medium: 1, low: 2 }[p] ?? 1; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function getProjectById(id) { return state.projects.find(p => p.id === id); }

function getFilteredTasks() {
  let tasks = state.tasks.filter(t =>
    state.activeProject === null || t.projectId === state.activeProject
  );
  const prio = document.getElementById('filter-priority').value;
  if (prio !== 'all') tasks = tasks.filter(t => t.priority === prio);

  const sort = document.getElementById('sort-by').value;
  if (sort === 'due-asc') {
    tasks.sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    });
  } else if (sort === 'due-desc') {
    tasks.sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return b.dueDate.localeCompare(a.dueDate);
    });
  } else if (sort === 'priority') {
    tasks.sort((a, b) => priorityOrder(a.priority) - priorityOrder(b.priority));
  }
  return tasks;
}

// ── RENDER ─────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('project-list');
  list.innerHTML = '';

  state.projects.forEach(p => {
    const count = state.tasks.filter(t => t.projectId === p.id && t.status !== 'done').length;
    const el = document.createElement('div');
    el.className = 'project-item' + (state.activeProject === p.id ? ' active' : '');
    el.innerHTML = `
      <span class="project-dot" style="background:${p.color}"></span>
      <span class="project-name">${escHtml(p.name)}</span>
      <span class="project-count">${count}</span>
      <button class="project-del" onclick="deleteProject(event,'${p.id}')" title="Delete project">✕</button>
    `;
    el.addEventListener('click', (e) => { if (!e.target.classList.contains('project-del')) selectProject(p.id); });
    list.appendChild(el);
  });

  const allCount = state.tasks.filter(t => t.status !== 'done').length;
  document.getElementById('all-count').textContent = allCount;
  document.getElementById('all-tasks-btn').className = state.activeProject === null ? 'active' : '';
}

function renderBoard() {
  const tasks = getFilteredTasks();
  const statuses = ['todo', 'inprogress', 'done'];

  statuses.forEach(status => {
    const list = document.getElementById(`list-${status}`);
    const countEl = document.getElementById(`count-${status}`);
    const cols = tasks.filter(t => t.status === status);
    countEl.textContent = cols.length;

    if (cols.length === 0) {
      list.innerHTML = `<div class="empty-col"><div class="empty-icon">${status === 'done' ? '✓' : '·'}</div>No tasks</div>`;
      return;
    }

    list.innerHTML = '';
    cols.forEach(task => {
      list.appendChild(makeTaskCard(task));
    });
  });
}

function makeTaskCard(task) {
  const project = getProjectById(task.projectId);
  const dc = dueDateClass(task.dueDate);
  const statusLabel = { todo: 'To Do', inprogress: 'In Progress', done: 'Done' }[task.status];
  const statusCls   = { todo: 'status-todo', inprogress: 'status-inprogress', done: 'status-done' }[task.status];

  const card = document.createElement('div');
  card.className = 'task-card';
  card.draggable = true;
  card.dataset.id = task.id;

  card.innerHTML = `
    <div class="task-top">
      <div class="task-title">${escHtml(task.title)}</div>
      <div class="task-actions">
        <button class="task-btn" onclick="openTaskModal('${task.id}')" title="Edit">✎</button>
        <button class="task-btn del" onclick="deleteTask('${task.id}')" title="Delete">✕</button>
      </div>
    </div>
    ${task.notes ? `<div class="task-notes">${escHtml(task.notes)}</div>` : ''}
    <div class="task-meta" style="margin-top:${task.notes ? '8px' : '4px'}">
      <span class="badge priority-${task.priority}" onclick="cyclePriority('${task.id}')">${task.priority}</span>
      ${project ? `<span class="project-pill" style="background:${hexToRgba(project.color,0.18)};color:${project.color}">${escHtml(project.name)}</span>` : ''}
      ${task.dueDate ? `<span class="due-date ${dc}">📅 ${formatDate(task.dueDate)}</span>` : ''}
    </div>
  `;

  card.addEventListener('dragstart', onDragStart);
  card.addEventListener('dragend', onDragEnd);
  return card;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── PROJECT MODAL ──────────────────────────────────────────────────
function openProjectModal(id) {
  state.editingProjectId = id || null;
  const modal = document.getElementById('project-modal');
  const title = document.getElementById('project-modal-title');

  buildColorPicker();

  if (id) {
    const p = getProjectById(id);
    title.textContent = 'Edit Project';
    document.getElementById('project-name-input').value = p.name;
    state.selectedColor = p.color;
    refreshColorPicker();
  } else {
    title.textContent = 'New Project';
    document.getElementById('project-name-input').value = '';
    state.selectedColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    refreshColorPicker();
  }

  modal.classList.add('open');
  setTimeout(() => document.getElementById('project-name-input').focus(), 50);
}

function closeProjectModal() {
  document.getElementById('project-modal').classList.remove('open');
}

function buildColorPicker() {
  const cp = document.getElementById('color-picker');
  cp.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === state.selectedColor ? ' selected' : '');
    sw.style.background = c;
    sw.title = c;
    sw.onclick = () => { state.selectedColor = c; refreshColorPicker(); };
    cp.appendChild(sw);
  });
}

function refreshColorPicker() {
  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.classList.toggle('selected', sw.style.background === hexToRgb(state.selectedColor) || sw.title === state.selectedColor);
  });
}

// browsers may normalize hex to rgb in style.background
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function saveProject() {
  const name = document.getElementById('project-name-input').value.trim();
  if (!name) { document.getElementById('project-name-input').focus(); return; }

  if (state.editingProjectId) {
    const p = getProjectById(state.editingProjectId);
    p.name = name; p.color = state.selectedColor;
    toast('Project updated');
  } else {
    state.projects.push({ id: uid(), name, color: state.selectedColor });
    toast('Project created');
  }

  save();
  closeProjectModal();
  renderSidebar();
  renderBoard();
}

function deleteProject(e, id) {
  e.stopPropagation();
  if (!confirm('Delete this project? Tasks will lose their project assignment.')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  state.tasks.forEach(t => { if (t.projectId === id) t.projectId = ''; });
  if (state.activeProject === id) state.activeProject = null;
  save(); renderSidebar(); renderBoard();
  toast('Project deleted');
}

// ── TASK MODAL ─────────────────────────────────────────────────────
function openTaskModal(id) {
  state.editingTaskId = id || null;
  const modal = document.getElementById('task-modal');
  const title = document.getElementById('task-modal-title');

  // populate project dropdown
  const sel = document.getElementById('task-project-input');
  sel.innerHTML = '<option value="">No Project</option>';
  state.projects.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name;
    sel.appendChild(opt);
  });

  if (id) {
    const t = state.tasks.find(x => x.id === id);
    title.textContent = 'Edit Task';
    document.getElementById('task-title-input').value = t.title;
    document.getElementById('task-notes-input').value = t.notes || '';
    document.getElementById('task-priority-input').value = t.priority;
    document.getElementById('task-status-input').value = t.status;
    document.getElementById('task-due-input').value = t.dueDate || '';
    sel.value = t.projectId || '';
  } else {
    title.textContent = 'New Task';
    document.getElementById('task-title-input').value = '';
    document.getElementById('task-notes-input').value = '';
    document.getElementById('task-priority-input').value = 'medium';
    document.getElementById('task-status-input').value = 'todo';
    document.getElementById('task-due-input').value = '';
    sel.value = state.activeProject || '';
  }

  modal.classList.add('open');
  setTimeout(() => document.getElementById('task-title-input').focus(), 50);
}

function closeTaskModal() {
  document.getElementById('task-modal').classList.remove('open');
}

function saveTask() {
  const title = document.getElementById('task-title-input').value.trim();
  if (!title) { document.getElementById('task-title-input').focus(); return; }

  const data = {
    title,
    notes: document.getElementById('task-notes-input').value.trim(),
    priority: document.getElementById('task-priority-input').value,
    status: document.getElementById('task-status-input').value,
    dueDate: document.getElementById('task-due-input').value,
    projectId: document.getElementById('task-project-input').value,
  };

  if (state.editingTaskId) {
    const t = state.tasks.find(x => x.id === state.editingTaskId);
    Object.assign(t, data);
    toast('Task updated');
  } else {
    state.tasks.push({ id: uid(), createdAt: Date.now(), ...data });
    toast('Task created');
  }

  save();
  closeTaskModal();
  renderSidebar();
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  save(); renderSidebar(); renderBoard();
  toast('Task deleted');
}

// ── CYCLE PRIORITY ─────────────────────────────────────────────────
function cyclePriority(id) {
  const t = state.tasks.find(x => x.id === id);
  const order = ['high', 'medium', 'low'];
  t.priority = order[(order.indexOf(t.priority) + 1) % order.length];
  save(); renderBoard();
}

// ── DRAG & DROP ────────────────────────────────────────────────────
let draggingId = null;

function onDragStart(e) {
  draggingId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.task-list').forEach(l => l.classList.remove('drag-over'));
}

function onDragOver(e, status) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const list = document.getElementById(`list-${status}`);
  document.querySelectorAll('.task-list').forEach(l => l.classList.remove('drag-over'));
  list.classList.add('drag-over');
}

function onDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.querySelector('.task-list')?.classList.remove('drag-over');
  }
}

function onDrop(e, status) {
  e.preventDefault();
  if (!draggingId) return;
  const t = state.tasks.find(x => x.id === draggingId);
  if (t && t.status !== status) {
    t.status = status;
    save(); renderSidebar(); renderBoard();
    const label = { todo: 'To Do', inprogress: 'In Progress', done: 'Done' }[status];
    toast(`Moved to ${label}`);
  }
  draggingId = null;
  document.querySelectorAll('.task-list').forEach(l => l.classList.remove('drag-over'));
}

// ── PROJECT SELECTION ──────────────────────────────────────────────
function selectProject(id) {
  state.activeProject = id;
  const title = id ? getProjectById(id)?.name : 'All Tasks';
  document.getElementById('view-title').textContent = title || 'All Tasks';
  renderSidebar();
  renderBoard();
}

// ── KEYBOARD ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeTaskModal();
    closeProjectModal();
  }
  if ((e.key === 'Enter') && (e.metaKey || e.ctrlKey)) {
    const tModal = document.getElementById('task-modal');
    const pModal = document.getElementById('project-modal');
    if (tModal.classList.contains('open')) saveTask();
    else if (pModal.classList.contains('open')) saveProject();
  }
});

// close modal on backdrop click
['task-modal','project-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) {
      e.currentTarget.id === 'task-modal' ? closeTaskModal() : closeProjectModal();
    }
  });
});

// ── SEED DATA (first run) ──────────────────────────────────────────

// ── AUTH ───────────────────────────────────────────────────────────
const AUTH_HASH_KEY = 'tracker_pw_hash';
const AUTH_SESSION_KEY = 'tracker_authed';
let authMode = 'login'; // 'setup' | 'login' | 'change'

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function hasPassword() { return !!localStorage.getItem(AUTH_HASH_KEY); }
function isSessionAuthed() { return sessionStorage.getItem(AUTH_SESSION_KEY) === '1'; }

function showAuth(mode) {
  authMode = mode;
  const overlay  = document.getElementById('auth-overlay');
  const title    = document.getElementById('auth-title');
  const subtitle = document.getElementById('auth-subtitle');
  const confirmEl= document.getElementById('auth-confirm');
  const btn      = document.getElementById('auth-btn');
  const hint     = document.getElementById('auth-hint');
  const backBtn  = document.getElementById('auth-cancel-change');

  document.getElementById('auth-pw').value = '';
  document.getElementById('auth-confirm').value = '';
  document.getElementById('auth-error').textContent = '';

  if (mode === 'setup') {
    title.textContent = 'Set Your Password';
    subtitle.textContent = 'Choose a password to protect your tracker.';
    confirmEl.style.display = '';
    btn.textContent = 'Set Password';
    hint.textContent = "You'll need this password every time you open the tracker.";
    backBtn.style.display = 'none';
  } else if (mode === 'change') {
    title.textContent = 'Change Password';
    subtitle.textContent = 'Enter your current password, then choose a new one.';
    confirmEl.style.display = '';
    btn.textContent = 'Update Password';
    hint.textContent = '';
    backBtn.style.display = '';
  } else {
    title.textContent = 'My Tracker';
    subtitle.textContent = 'Enter your password to continue.';
    confirmEl.style.display = 'none';
    btn.textContent = 'Unlock';
    hint.textContent = 'Session stays unlocked until you close the tab.';
    backBtn.style.display = 'none';
  }

  overlay.classList.remove('hidden');
  setTimeout(() => document.getElementById('auth-pw').focus(), 50);
}

function hideAuth() {
  document.getElementById('auth-overlay').classList.add('hidden');
}

async function handleAuth() {
  const pw      = document.getElementById('auth-pw').value;
  const confirm = document.getElementById('auth-confirm').value;
  const errorEl = document.getElementById('auth-error');
  errorEl.textContent = '';

  if (!pw) { errorEl.textContent = 'Please enter a password.'; return; }

  if (authMode === 'setup') {
    if (pw.length < 4)   { errorEl.textContent = 'Password must be at least 4 characters.'; return; }
    if (pw !== confirm)  { errorEl.textContent = 'Passwords do not match.'; return; }
    localStorage.setItem(AUTH_HASH_KEY, await sha256(pw));
    sessionStorage.setItem(AUTH_SESSION_KEY, '1');
    hideAuth();
    bootApp();

  } else if (authMode === 'change') {
    // first field = current password, second = new password
    // re-use auth-pw for current, auth-confirm for new password
    const currentHash = await sha256(pw);
    if (currentHash !== localStorage.getItem(AUTH_HASH_KEY)) {
      errorEl.textContent = 'Current password is incorrect.'; return;
    }
    if (!confirm)             { errorEl.textContent = 'Enter a new password.'; return; }
    if (confirm.length < 4)  { errorEl.textContent = 'New password must be at least 4 characters.'; return; }
    localStorage.setItem(AUTH_HASH_KEY, await sha256(confirm));
    toast('Password updated');
    hideAuth();

  } else {
    const hash = await sha256(pw);
    if (hash === localStorage.getItem(AUTH_HASH_KEY)) {
      sessionStorage.setItem(AUTH_SESSION_KEY, '1');
      hideAuth();
      bootApp();
    } else {
      errorEl.textContent = 'Incorrect password.';
      document.getElementById('auth-pw').select();
    }
  }
}

function lockApp() {
  sessionStorage.removeItem(AUTH_SESSION_KEY);
  showAuth('login');
}

function changePasswordFlow() {
  // re-use confirm field for "new password" in change mode
  document.getElementById('auth-confirm').placeholder = 'New password';
  document.getElementById('auth-pw').placeholder = 'Current password';
  showAuth('change');
}

function cancelChangePassword() {
  document.getElementById('auth-pw').placeholder = 'Password';
  document.getElementById('auth-confirm').placeholder = 'Confirm password';
  showAuth('login');
}

document.getElementById('auth-btn').addEventListener('click', handleAuth);
['auth-pw','auth-confirm'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAuth();
  });
});

// ── BOOT ───────────────────────────────────────────────────────────
function bootApp() {
  load();
  if (state.projects.length === 0 && state.tasks.length === 0) seedData();
  renderSidebar();
  renderBoard();
}

if (isSessionAuthed()) {
  hideAuth();
  bootApp();
} else if (!hasPassword()) {
  showAuth('setup');
} else {
  showAuth('login');
}
</script>
